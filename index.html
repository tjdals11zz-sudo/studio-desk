const pad=n=>String(n).padStart(2,"0");
const toKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const shiftKey=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return toKey(d);};
const diffDays=(a,b)=>Math.round((fromKey(b)-fromKey(a))/86400000);
const fmtMD=k=>`${Number(k.slice(5,7))}/${Number(k.slice(8,10))}`;
const hhmm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const dur=m=>m>=60?`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:""}`:` ${m}분`;
const DAYS=["일","월","화","수","목","금","토"];
const weekStart=k=>shiftKey(k,-((fromKey(k).getDay()+6)%7));
const tplFor=k=>{const phase=k>=SWITCH_DATE?"full":"prep";const g=fromKey(k).getDay();return TEMPLATES[phase][g===0||g===6?"weekend":"weekday"];};
const makeDay=k=>{const t=tplFor(k);return{start:t.start,cap:t.blocks.filter(([,,tr])=>tr!=="off").reduce((s,[m])=>s+m,0),blocks:t.blocks.map(([min,label,track],i)=>({id:`b${i}`,min,label,track,done:false,subs:[]}))};};

async function loadFromDB() {
  try {
    const {data,error} = await sb.from("TimeBox").select("data").eq("user_id", USER_ID).single();
    if (error || !data) return null;
    return JSON.parse(data.data);
  } catch(e) { return null; }
}

async function saveToDB(state) {
  try {
    const {data} = await sb.from("TimeBox").select("user_id").eq("user_id", USER_ID).single();
    if (data) {
      await sb.from("TimeBox").update({data: JSON.stringify(state)}).eq("user_id", USER_ID);
    } else {
      await sb.from("TimeBox").insert({user_id: USER_ID, data: JSON.stringify(state)});
    }
  } catch(e) { console.error("save error", e); }
}

function App() {
  const [state, setState] = useState(null);
  const [status, setStatus] = useState("loading");
  const [view, setView] = useState("day");
  const [date, setDate] = useState(() => toKey(new Date()));
  const [edit, setEdit] = useState(false);
  const [open, setOpen] = useState({});
  const [draft, setDraft] = useState({ label: "", min: "30", track: "oju" });
  const [subDraft, setSubDraft] = useState({});
  const [goalDraft, setGoalDraft] = useState({});
  const [undo, setUndo] = useState(null);
  const [now, setNow] = useState(() => new Date());
  const [saving, setSaving] = useState(false);

  useEffect(() => { setUndo(null); }, [date]);
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);

  useEffect(() => {
    (async () => {
      let loaded = await loadFromDB();
      if (!loaded) loaded = { days: {}, goals: DEFAULT_GOALS };
      setState(loaded);
      setStatus("ready");
    })();
  }, []);

  const save = async (next) => {
    setState(next);
    setSaving(true);
    await saveToDB(next);
    setSaving(false);
  };

  const today = toKey(new Date());
  const dday = diffDays(today, SWITCH_DATE);
  const day = useMemo(() => (state && state.days[date]) || makeDay(date), [state, date]);
  const goals = (state && state.goals) || [];

  const laid = useMemo(() => {
    let t = day.start;
    return day.blocks.map(b => { const s = t; t += b.min; return { ...b, s, e: t }; });
  }, [day]);

  const endMin = laid.length ? laid[laid.length - 1].e : day.start;
  const planMin = day.blocks.filter(b => b.track !== "off").reduce((s, b) => s + b.min, 0);
  const doneMin = day.blocks.filter(b => b.done && b.track !== "off").reduce((s, b) => s + b.min, 0);
  const leftMin = day.cap - planMin;

  const nowMin = now.getHours() * 60 + now.getMinutes();
  const isToday = date === today;
  const current = isToday ? laid.find(b => nowMin >= b.s && nowMin < b.e) : null;
  const nextB = isToday ? laid.find(b => b.s > nowMin) : null;
  const currentSub = current ? (current.subs || []).find(s => !s.done) : null;

  const setDay = d => save({ ...state, days: { ...state.days, [date]: d } });
  const setDaySafe = d => { setUndo(day); setDay(d); };
  const patchBlock = (id, fn) => setDay({ ...day, blocks: day.blocks.map(b => b.id === id ? fn(b) : b) });
  const delBlock = id => setDaySafe({ ...day, blocks: day.blocks.filter(b => b.id !== id) });

  const toggleSub = (bid, sid) => patchBlock(bid, b => {
    const subs = b.subs.map(s => s.id === sid ? { ...s, done: !s.done } : s);
    return { ...b, subs, done: subs.length > 0 && subs.every(s => s.done) };
  });
  const toggleBlock = bid => patchBlock(bid, b => {
    const nd = !b.done;
    return { ...b, done: nd, subs: (b.subs || []).map(s => ({ ...s, done: nd })) };
  });

  const addBlock = () => {
    const label = draft.label.trim();
    if (!label) return;
    const min = Math.max(5, parseInt(draft.min, 10) || 30);
    setDay({ ...day, blocks: [...day.blocks, { id: `b${Date.now()}`, min, label, track: draft.track, done: false, subs: [] }] });
    setDraft({ ...draft, label: "", min: "30" });
  };

  const copyYesterday = () => {
    const y = state.days[shiftKey(date, -1)];
    if (!y || !y.blocks.length) return;
    setDaySafe({ start: day.start, cap: y.cap, blocks: y.blocks.map((b, i) => ({ id: `b${Date.now()}${i}`, min: b.min, label: b.label, track: b.track, done: false, subs: (b.subs || []).map((s, j) => ({ id: `s${Date.now()}${j}`, label: s.label, done: false })) })) });
  };

  const todayGoals = goals.filter(g => !g.done && g.due === date);
  const late = goals.filter(g => !g.done && g.due < today).sort((a, b) => a.due.localeCompare(b.due));
  const toggleGoal = id => save({ ...state, goals: goals.map(g => g.id === id ? { ...g, done: !g.done } : g) });
  const pushGoal = id => save({ ...state, goals: goals.map(g => g.id === id ? { ...g, due: shiftKey(g.due, 1) } : g) });
  const delGoal = id => save({ ...state, goals: goals.filter(g => g.id !== id) });

  const wStart = weekStart(date);
  const weekDays = Array.from({ length: 7 }, (_, i) => shiftKey(wStart, i));
  const yDay = state && state.days[shiftKey(date, -1)];
  const hasYesterday = yDay && yDay.blocks.length > 0;

  if (status === "loading") return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.bg,gap:16}}>
      <div style={{fontSize:48}}>⚡</div>
      <div style={{fontFamily:"monospace",fontSize:14,color:C.faint}}>불러오는 중…</div>
    </div>
  );

  const card = (extra={}) => ({background:C.panel,border:`1px solid ${C.line}`,borderRadius:12,...extra});
  const card2 = (extra={}) => ({background:C.panel2,border:`1px solid ${C.line}`,borderRadius:12,...extra});

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text}}>
      <div style={{maxWidth:560,margin:"0 auto",padding:"24px 16px"}}>
        {/* 헤더 */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:22}}>⚡</span>
            <span style={{fontSize:18,fontWeight:700,letterSpacing:-0.5}}>ToDo</span>
          </div>
          {saving && <span style={{fontFamily:"monospace",fontSize:11,color:C.faint}}>저장 중…</span>}
          {dday>0 && <span style={{fontFamily:"monospace",fontSize:12,color:C.faint}}>전업까지 D-{dday}</span>}
        </div>

        {/* 지금 */}
        <div style={{...card({padding:20}),marginBottom:16,border:`1px solid ${current?TRACKS[current.track]:C.line}`}}>
          <div style={{fontFamily:"monospace",fontSize:12,color:C.faint,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><Clock size={11}/> {hhmm(nowMin)}</div>
          {current?(
            <div>
              <div style={{fontSize:22,fontWeight:600,lineHeight:1.3}}>{current.label}</div>
              {currentSub&&<div style={{fontSize:14,marginTop:6,color:C.dim}}>지금 → {currentSub.label}</div>}
              <div style={{fontFamily:"monospace",fontSize:14,marginTop:8,color:TRACKS[current.track]}}>{hhmm(current.s)} – {hhmm(current.e)} · {current.e-nowMin}분 남음</div>
            </div>
          ):nextB?(
            <div>
              <div style={{fontSize:22,fontWeight:600,color:C.dim}}>쉬는 시간</div>
              <div style={{fontFamily:"monospace",fontSize:14,marginTop:8,color:C.faint}}>{hhmm(nextB.s)}부터 · {nextB.label}</div>
            </div>
          ):day.blocks.length===0?(
            <div>
              <div style={{fontSize:22,fontWeight:600,color:C.dim}}>시간표가 비어 있어</div>
              <div style={{fontFamily:"monospace",fontSize:14,marginTop:8,color:C.faint}}>블록을 넣거나 기본 시간표를 불러와</div>
            </div>
          ):(
            <div>
              <div style={{fontSize:22,fontWeight:600,color:C.dim}}>{isToday?"오늘 블록 끝":`${fmtMD(date)} 시간표`}</div>
              <div style={{fontFamily:"monospace",fontSize:14,marginTop:8,color:C.faint}}>{hhmm(day.start)} – {hhmm(endMin)} · {dur(planMin)}</div>
            </div>
          )}
        </div>

        {/* 탭 */}
        <div style={{display:"flex",gap:4,padding:4,background:C.panel,borderRadius:10,marginBottom:16}}>
          {[["day","시간표"],["week","이번 주"]].map(([k,l])=>(
            <button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"8px 0",borderRadius:8,fontSize:14,fontWeight:500,background:view===k?C.panel2:"transparent",color:view===k?C.text:C.faint}}>{l}</button>
          ))}
        </div>

        {view==="day"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <button onClick={()=>setDate(shiftKey(date,-1))} style={{color:C.faint,padding:6}}><ChevronLeft size={18}/></button>
              <button onClick={()=>setDate(today)} style={{fontFamily:"monospace",fontSize:14,color:isToday?C.text:C.mint}}>{fmtMD(date)} ({DAYS[fromKey(date).getDay()]})</button>
              <button onClick={()=>setDate(shiftKey(date,1))} style={{color:C.faint,padding:6}}><ChevronRight size={18}/></button>
            </div>

            <div style={{...card({padding:16}),marginBottom:16}}>
              {[["시작",hhmm(day.start),()=>setDay({...day,start:Math.max(0,day.start-30)}),()=>setDay({...day,start:Math.min(23*60,day.start+30)})],["쓸 시간",dur(day.cap),()=>setDay({...day,cap:Math.max(30,day.cap-30)}),()=>setDay({...day,cap:Math.min(16*60,day.cap+30)})]].map(([label,val,dec,inc])=>(
                <div key={label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <span style={{fontFamily:"monospace",fontSize:12,color:C.faint,width:56}}>{label}</span>
                  <button onClick={dec} style={{width:28,height:28,borderRadius:6,background:C.panel2,color:C.dim,display:"flex",alignItems:"center",justifyContent:"center"}}><Minus size={12}/></button>
                  <span style={{fontFamily:"monospace",fontSize:14,width:64,textAlign:"center"}}>{val}</span>
                  <button onClick={inc} style={{width:28,height:28,borderRadius:6,background:C.panel2,color:C.dim,display:"flex",alignItems:"center",justifyContent:"center"}}><Plus size={12}/></button>
                </div>
              ))}
              <div style={{height:8,borderRadius:4,overflow:"hidden",background:C.panel2,marginBottom:8}}>
                <div style={{height:"100%",width:`${Math.min(100,(planMin/day.cap)*100)}%`,background:planMin>day.cap?C.coral:C.amber,transition:"width .3s"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontFamily:"monospace",fontSize:12}}>
                <span style={{color:C.dim}}>배정 {planMin}분 · 완료 {doneMin}분</span>
                <span style={{color:leftMin<0?C.coral:C.faint}}>{leftMin<0?`${-leftMin}분 초과`:`${leftMin}분 남음`}</span>
              </div>
            </div>

            {late.length>0&&isToday&&(
              <div style={{...card({padding:12,border:`1px solid ${C.coral}`}),marginBottom:16}}>
                <div style={{fontFamily:"monospace",fontSize:12,color:C.coral,marginBottom:4}}>밀림 {late.length}</div>
                {late.slice(0,3).map(g=>(
                  <div key={g.id} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
                    <button onClick={()=>toggleGoal(g.id)} style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${C.coral}`,background:"transparent",flexShrink:0}}/>
                    <span style={{fontSize:14,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.label}</span>
                    <span style={{fontFamily:"monospace",fontSize:12,color:C.faint}}>{g.pj}</span>
                  </div>
                ))}
              </div>
            )}

            {todayGoals.length>0&&(
              <div style={{...card2({padding:12}),marginBottom:16}}>
                <div style={{fontFamily:"monospace",fontSize:12,color:C.amber,marginBottom:4}}>오늘 끝낼 것</div>
                {todayGoals.map(g=>(
                  <div key={g.id} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
                    <button onClick={()=>toggleGoal(g.id)} style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${TRACKS[g.track]}`,background:"transparent",flexShrink:0}}/>
                    <span style={{fontSize:14,flex:1}}>{g.label}</span>
                    <span style={{fontFamily:"monospace",fontSize:12,color:C.faint}}>{g.pj}</span>
                  </div>
                ))}
              </div>
            )}

            {day.blocks.length===0&&(
              <div style={{...card({padding:"24px 16px"}),marginBottom:16,textAlign:"center",fontSize:14,color:C.faint,borderStyle:"dashed"}}>
                블록이 없어. 아래에서 넣거나 기본 시간표를 불러와.
              </div>
            )}

            {laid.map(b=>{
              const isNow=current&&current.id===b.id;
              const past=isToday&&nowMin>=b.e;
              const subs=b.subs||[];
              const sDone=subs.filter(s=>s.done).length;
              const isOpen=open[b.id]!==undefined?open[b.id]:isNow;
              return (
                <div key={b.id} style={{display:"flex",gap:12,marginBottom:6}}>
                  <div style={{width:48,flexShrink:0,paddingTop:12}}>
                    <div style={{fontFamily:"monospace",fontSize:12,color:isNow?TRACKS[b.track]:C.faint}}>{hhmm(b.s)}</div>
                  </div>
                  <div style={{flex:1,minWidth:0,borderRadius:12,background:C.panel,border:`1px solid ${isNow?TRACKS[b.track]:C.line}`,borderLeft:`3px solid ${TRACKS[b.track]}`,opacity:b.done||(past&&!b.done)?0.6:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px"}}>
                      <button onClick={()=>toggleBlock(b.id)} style={{width:20,height:20,borderRadius:4,border:`1.5px solid ${b.done?TRACKS[b.track]:C.line}`,background:b.done?TRACKS[b.track]:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {b.done&&<Check size={13} strokeWidth={3}/>}
                      </button>
                      <button onClick={()=>setOpen({...open,[b.id]:!isOpen})} style={{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
                        <span style={{flex:1,minWidth:0,fontSize:14,textDecoration:b.done?"line-through":"none",color:b.done?C.faint:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.label}</span>
                        {subs.length>0&&<span style={{fontFamily:"monospace",fontSize:12,flexShrink:0,color:sDone===subs.length?C.mint:C.faint}}>{sDone}/{subs.length}</span>}
                        <span style={{fontFamily:"monospace",fontSize:12,flexShrink:0,color:C.faint}}>{b.min}분</span>
                        {isOpen?<ChevronDown size={13}/>:<ChevronRight size={13}/>}
                      </button>
                    </div>
                    {isOpen&&(
                      <div style={{padding:"8px 16px 12px",borderTop:`1px solid ${C.line}`}}>
                        {subs.map(s=>(
                          <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
                            <button onClick={()=>toggleSub(b.id,s.id)} style={{width:14,height:14,borderRadius:3,border:`1.5px solid ${s.done?TRACKS[b.track]:C.line}`,background:s.done?TRACKS[b.track]:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                              {s.done&&<Check size={9} strokeWidth={3}/>}
                            </button>
                            <span style={{flex:1,fontSize:14,color:s.done?C.faint:C.dim,textDecoration:s.done?"line-through":"none"}}>{s.label}</span>
                            <button onClick={()=>patchBlock(b.id,x=>({...x,subs:x.subs.filter(y=>y.id!==s.id)}))} style={{color:C.faint,display:"flex"}}><Trash2 size={11}/></button>
                          </div>
                        ))}
                        <input value={subDraft[b.id]||""} onChange={e=>setSubDraft({...subDraft,[b.id]:e.target.value})} onKeyDown={e=>{if(e.key!=="Enter")return;const v=(subDraft[b.id]||"").trim();if(!v)return;patchBlock(b.id,x=>({...x,subs:[...(x.subs||[]),{id:`s${Date.now()}`,label:v,done:false}],done:false}));setSubDraft({...subDraft,[b.id]:""}); }} placeholder="소주제 추가 (엔터)" style={{width:"100%",marginTop:6,padding:"6px 10px",borderRadius:8,fontSize:14,background:C.panel2,color:C.text,border:`1px solid ${C.line}`}}/>
                        <button onClick={()=>delBlock(b.id)} style={{fontFamily:"monospace",fontSize:12,marginTop:10,color:C.coral,display:"flex",alignItems:"center",gap:4}}>
                          <Trash2 size={11}/> 이 블록 삭제
                        </button>
                      </div>
                    )}
                  </div>
                  {edit&&(
                    <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0,paddingTop:4}}>
                      {[["15분 늘리기",()=>patchBlock(b.id,x=>({...x,min:x.min+15})),C.dim,<Plus size={11}/>],["15분 줄이기",()=>patchBlock(b.id,x=>({...x,min:Math.max(5,x.min-15)})),C.dim,<Minus size={11}/>],["블록 삭제",()=>delBlock(b.id),C.coral,<Trash2 size={11}/>]].map(([lbl,fn,col,ic])=>(
                        <button key={lbl} onClick={fn} style={{width:24,height:24,borderRadius:6,background:C.panel2,color:col,display:"flex",alignItems:"center",justifyContent:"center"}}>{ic}</button>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}

            {day.blocks.length>0&&(
              <div style={{display:"flex",gap:12,marginTop:6}}>
                <div style={{width:48,flexShrink:0}}><div style={{fontFamily:"monospace",fontSize:12,color:C.faint}}>{hhmm(endMin)}</div></div>
                <div style={{fontSize:12,fontFamily:"monospace",color:C.faint}}>끝</div>
              </div>
            )}

            <div style={{...card({padding:12}),marginTop:20}}>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input value={draft.label} onChange={e=>setDraft({...draft,label:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addBlock()} placeholder="블록 이름" style={{flex:1,minWidth:0,padding:"8px 12px",borderRadius:8,fontSize:14,background:C.panel2,color:C.text,border:`1px solid ${C.line}`}}/>
                <input value={draft.min} onChange={e=>setDraft({...draft,min:e.target.value})} style={{width:56,padding:"8px",borderRadius:8,fontSize:14,fontFamily:"monospace",textAlign:"center",background:C.panel2,color:C.text,border:`1px solid ${C.line}`}}/>
                <button onClick={addBlock} style={{padding:"0 12px",borderRadius:8,background:C.amber,color:C.bg,display:"flex",alignItems:"center"}}><Plus size={16} strokeWidth={2.5}/></button>
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                {TRACK_ORDER.map(k=>(
                  <button key={k} onClick={()=>setDraft({...draft,track:k})} style={{padding:"4px 10px",borderRadius:6,fontFamily:"monospace",fontSize:12,background:draft.track===k?TRACKS[k]:C.panel2,color:draft.track===k?C.bg:C.faint}}>{TRACK_LABEL[k]}</button>
                ))}
                <button onClick={()=>setEdit(!edit)} style={{marginLeft:"auto",padding:"4px 10px",borderRadius:6,fontFamily:"monospace",fontSize:12,background:edit?C.violet:C.panel2,color:edit?C.bg:C.faint}}>{edit?"조정 끝":"조정"}</button>
              </div>
            </div>

            <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap",alignItems:"center"}}>
              <button onClick={()=>setDaySafe(makeDay(date))} style={{fontFamily:"monospace",fontSize:12,color:C.dim,display:"flex",alignItems:"center",gap:4}}><RotateCcw size={11}/> 기본 시간표</button>
              {hasYesterday&&<button onClick={copyYesterday} style={{fontFamily:"monospace",fontSize:12,color:C.dim,display:"flex",alignItems:"center",gap:4}}><Copy size={11}/> 어제 것 불러오기</button>}
              {day.blocks.length>0&&<button onClick={()=>setDaySafe({...day,blocks:[]})} style={{fontFamily:"monospace",fontSize:12,color:C.faint,marginLeft:"auto"}}>전부 지우기</button>}
            </div>

            {undo&&(
              <button onClick={()=>{setDay(undo);setUndo(null);}} style={{width:"100%",marginTop:12,padding:"10px 0",borderRadius:8,fontFamily:"monospace",fontSize:12,background:C.panel2,color:C.mint,border:`1px solid ${C.mint}`,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                <RotateCcw size={12}/> 방금 지운 것 되돌리기
              </button>
            )}
          </div>
        )}

        {view==="week"&&(
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
              <button onClick={()=>setDate(shiftKey(date,-7))} style={{color:C.faint,padding:6}}><ChevronLeft size={18}/></button>
              <span style={{fontFamily:"monospace",fontSize:14}}>{fmtMD(wStart)} — {fmtMD(weekDays[6])}</span>
              <button onClick={()=>setDate(shiftKey(date,7))} style={{color:C.faint,padding:6}}><ChevronRight size={18}/></button>
            </div>
            {weekDays.map(k=>{
              const gs=goals.filter(g=>g.due===k);
              const isT=k===today;
              return (
                <div key={k} style={{marginBottom:12}}>
                  <button onClick={()=>{setDate(k);setView("day");}} style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:4}}>
                    <span style={{fontFamily:"monospace",fontSize:14,color:isT?C.amber:k<today?C.faint:C.text}}>{fmtMD(k)}</span>
                    <span style={{fontFamily:"monospace",fontSize:12,color:isT?C.amber:C.faint}}>{DAYS[fromKey(k).getDay()]}</span>
                  </button>
                  <div style={{borderRadius:8,overflow:"hidden",border:`1px solid ${C.line}`}}>
                    {gs.map((g,i)=>(
                      <div key={g.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:C.panel,borderTop:i===0?"none":`1px solid ${C.line}`}}>
                        <button onClick={()=>toggleGoal(g.id)} style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${g.done?TRACKS[g.track]:!g.done&&g.due<today?C.coral:C.line}`,background:g.done?TRACKS[g.track]:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {g.done&&<Check size={11} strokeWidth={3}/>}
                        </button>
                        <span style={{flex:1,minWidth:0,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:g.done?C.faint:C.text,textDecoration:g.done?"line-through":"none"}}>{g.label}</span>
                        <span style={{fontFamily:"monospace",fontSize:12,flexShrink:0,color:C.faint}}>{g.pj}</span>
                        {!g.done&&<button onClick={()=>pushGoal(g.id)} style={{flexShrink:0,color:C.faint,display:"flex"}}><ArrowRight size={13}/></button>}
                        <button onClick={()=>delGoal(g.id)} style={{flexShrink:0,color:C.faint,display:"flex"}}><Trash2 size={11}/></button>
                      </div>
                    ))}
                    <input value={goalDraft[k]||""} onChange={e=>setGoalDraft({...goalDraft,[k]:e.target.value})} onKeyDown={e=>{if(e.key!=="Enter")return;const v=(goalDraft[k]||"").trim();if(!v)return;save({...state,goals:[...goals,{id:`g${Date.now()}`,label:v,pj:"",track:"oju",due:k,done:false}]});setGoalDraft({...goalDraft,[k]:""}); }} placeholder="마감 추가" style={{width:"100%",padding:"8px 12px",fontSize:14,background:C.panel,color:C.text,border:"none",borderTop:gs.length?`1px solid ${C.line}`:"none",outline:"none"}}/>
                  </div>
                </div>
              );
            })}
            <div style={{...card({padding:16}),marginTop:16}}>
              <div style={{fontSize:14,lineHeight:1.6,color:C.dim}}>못 지킨 블록은 다음 날로 옮기지 말고 버려. 마감만 화살표로 하루씩 미뤄.</div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
